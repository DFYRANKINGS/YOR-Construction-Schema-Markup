name: Update schema timestamps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"   # every Sunday at 3:00 UTC

permissions:
  contents: write

jobs:
  update-timestamps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Update timestamps in schema files
        run: |
          python <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          import yaml

          ROOT = "schemas"
          now_iso = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          updated_files = []

          def update_json(path):
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)

              changed = False

              if isinstance(data, dict):
                  if data.get("dateModified") != now_iso:
                      data["dateModified"] = now_iso
                      changed = True

                  # optional: if you want datePublished added only when missing, leave this
                  if "datePublished" not in data:
                      data["datePublished"] = now_iso
                      changed = True

              if changed:
                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                      f.write("\n")
                  updated_files.append(path)

          def update_yaml(path):
              with open(path, "r", encoding="utf-8") as f:
                  data = yaml.safe_load(f)

              changed = False

              if isinstance(data, dict):
                  if data.get("dateModified") != now_iso:
                      data["dateModified"] = now_iso
                      changed = True

                  if "datePublished" not in data:
                      data["datePublished"] = now_iso
                      changed = True

              if changed:
                  with open(path, "w", encoding="utf-8") as f:
                      yaml.safe_dump(data, f, sort_keys=False, allow_unicode=True)
                  updated_files.append(path)

          for root, _, files in os.walk(ROOT):
              for name in files:
                  path = os.path.join(root, name)
                  lower = name.lower()

                  try:
                      if lower.endswith((".json", ".jsonld")):
                          update_json(path)
                      elif lower.endswith((".yml", ".yaml")):
                          update_yaml(path)
                  except Exception as e:
                      print(f"Skipping {path}: {e}")

          print("Updated files:")
          for f in updated_files:
              print(f" - {f}")

          if not updated_files:
              print("No schema files needed timestamp updates.")
          PY

      - name: Commit timestamp changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schemas/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh schema timestamps"
            git push
          fi
