name: Monthly refresh and rebuild pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"   # 1st day of every month at 4:00 UTC

permissions:
  contents: write

jobs:
  refresh-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml openpyxl

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Create refresh marker
        run: |
          mkdir -p .refresh
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .refresh/last-refresh.txt
          echo "Monthly refresh marker updated."

      - name: Update schema timestamps
        run: |
          python <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          import yaml

          ROOT = "schemas"
          now_iso = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          for root, _, files in os.walk(ROOT):
              for name in files:
                  path = os.path.join(root, name)
                  lower = name.lower()

                  try:
                      if lower.endswith((".json", ".jsonld")):
                          with open(path, "r", encoding="utf-8") as f:
                              data = json.load(f)
                          if isinstance(data, dict):
                              data["dateModified"] = now_iso
                              with open(path, "w", encoding="utf-8") as f:
                                  json.dump(data, f, ensure_ascii=False, indent=2)
                                  f.write("\n")

                      elif lower.endswith((".yml", ".yaml")):
                          with open(path, "r", encoding="utf-8") as f:
                              data = yaml.safe_load(f)
                          if isinstance(data, dict):
                              data["dateModified"] = now_iso
                              with open(path, "w", encoding="utf-8") as f:
                                  yaml.safe_dump(data, f, sort_keys=False, allow_unicode=True)
                  except Exception as e:
                      print(f"Skipping {path}: {e}")
          PY

      - name: Rebuild public HTML pages
        run: |
          python build_public_pages.py

      - name: Regenerate sitemaps
        run: |
          if [ -f generate_sitemaps.py ]; then
            python generate_sitemaps.py
          else
            echo "generate_sitemaps.py not found, skipping."
          fi

      - name: Ensure .nojekyll exists
        run: |
          touch .nojekyll

      - name: Commit rebuilt files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schemas/ .refresh/ .nojekyll .
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: monthly refresh of AI crawlable pages"
            git push
          fi
