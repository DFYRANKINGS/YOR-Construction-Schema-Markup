name: Build public pages & sitemaps

on:
  push:
    paths:
      - 'schemas/**'
      - 'organization/**'
      - 'locations/**'
      - 'faq-schemas/**'
      - 'llm-data/**'
      - 'templates/**'
      - 'ai-generators/**'
      - 'build_public_pages.py'
      - 'generate_files_from_xlsx*.py'
      - 'generate_sitemaps.py'
      - '.github/workflows/build-public-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-public-pages
  cancel-in-progress: false

jobs:
  build-pages-and-sitemaps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pandas openpyxl

      # Optional: generate schema files from an Excel template (only runs if both exist)
      - name: Generate schema files from Excel (optional)
        run: |
          set -e
          if [ -f "generate_files_from_xlsx.py" ] && [ -f "templates/AI-Visibility-Master-Template.xlsx" ]; then
            echo "✅ Found generator + template. Regenerating schemas..."
            python generate_files_from_xlsx.py --input templates/AI-Visibility-Master-Template.xlsx --clean
          else
            echo "ℹ️ Skipping Excel generation (no generator and/or no template found)."
          fi

      - name: Build public pages
        run: |
          python build_public_pages.py

      # Optional: sitemaps (only runs if your repo includes the script)
      - name: Build sitemaps (optional)
        run: |
          set -e
          if [ -f "generate_sitemaps.py" ]; then
            python generate_sitemaps.py
          else
            echo "ℹ️ Skipping sitemap generation (generate_sitemaps.py not found)."
          fi

      - name: Commit & push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Auto-generate public pages" || echo "No changes to commit"
          git push
