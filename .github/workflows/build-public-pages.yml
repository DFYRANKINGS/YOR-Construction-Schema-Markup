name: Build public pages

on:
  workflow_dispatch:
  push:
    paths:
      - "build_public_pages.py"
      - "schemas/**"
      - "organization/**"
      - "locations/**"
      - "faq-schemas/**"
      - "faqs/**"
      - "reviews/**"
      - "llm-data/**"
      - ".github/workflows/build-public-pages.yml"

permissions:
  contents: write

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Build HTML pages
        run: |
          python build_public_pages.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-generate public pages" || echo "No changes to commit"
          git push
